<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Apply saved theme before first paint (default: light) to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("eg-theme") || "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="theme-color" content="#F3ECDD" />

    <!-- title, description, canonical, hreflang, og:url/title/description/locale,
         twitter:title/description — подставляются для каждой страницы и языка
         при сборке (scripts/prerender.mjs, utils/seo.ts) -->
    <!--app-head-->

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ecogumus.com/images/optimized/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale:alternate" content="uz_UZ" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ecogumus.com/images/optimized/og-image.jpg" />

    <!-- Favicon (единственный, корректный абсолютный путь) -->
    <link rel="icon" type="image/webp" href="/images/optimized/logo-80.webp" />

    <!-- «Земля и Зерно» typography — Spectral · Manrope · JetBrains Mono:
         самохостинг через @fontsource (см. main.tsx), Google Fonts CDN не используется -->

    <!--home-preload-start-->
    <!-- LCP-изображение главной: preload стартует загрузку до исполнения JS.
         imagesrcset/imagesizes должны совпадать с <picture> hero в HomePage.tsx -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="
        /images/optimized/NanoEco_3-480.webp 480w,
        /images/optimized/NanoEco_3-800.webp 800w,
        /images/optimized/NanoEco_3-1200.webp 1200w,
        /images/optimized/NanoEco_3-1600.webp 1600w
      "
      imagesizes="(min-width: 980px) 60vw, (min-width: 500px) 460px, 92vw"
      fetchpriority="high"
    />
    <!--home-preload-end-->

    <!-- Превью видео и embed-плеер запрашиваются только на /products -->
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />

    <!-- Inline critical CSS: warm cream background visible before JS loads, prevents white flash.
         Theme-aware so a returning dark-mode visitor doesn't see a light flash either. -->
    <style>
      html { background: #F3ECDD; }
      body { margin: 0; background: #F3ECDD; min-height: 100vh; }
      html[data-theme="dark"], body[data-theme="dark"] { background: #14160E; }
    </style>

    <!-- JSON-LD: Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "EkoGumus",
        "url": "https://ecogumus.com",
        "logo": "https://ecogumus.com/images/originals/logo.png",
        "description": "Производитель органических удобрений на основе биогумуса калифорнийских червей.",
        "foundingDate": "1997",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "UZ",
          "addressRegion": "Фергана"
        },
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "telephone": "+998-93-641-85-45",
            "contactType": "sales",
            "areaServed": "UZ",
            "availableLanguage": ["Russian", "Uzbek", "English"]
          }
        ],
        "sameAs": [
          "https://www.youtube.com/@biogumusfargonaekogumus8419"
        ]
      }
    </script>

    <!-- JSON-LD: Product structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Органическое удобрение EkoGumus (сухое)",
        "description": "Органические удобрения на основе биогумуса калифорнийских червей для повышения урожайности и улучшения структуры почвы. 100% натуральный состав.",
        "image": [
          "https://ecogumus.com/images/optimized/Products-1200.webp",
          "https://ecogumus.com/images/originals/Products.png"
        ],
        "brand": {
          "@type": "Brand",
          "name": "EkoGumus"
        },
        "manufacturer": {
          "@type": "Organization",
          "name": "EkoGumus",
          "url": "https://ecogumus.com"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "reviewCount": "30"
        },
        "offers": {
          "@type": "Offer",
          "priceCurrency": "UZS",
          "availability": "https://schema.org/InStock",
          "url": "https://ecogumus.com/products",
          "seller": {
            "@type": "Organization",
            "name": "EkoGumus"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
